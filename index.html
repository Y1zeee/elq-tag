<style>
/* Layout: sticky dashboard bar, terminal tabs, then page-sections of workstation cards, each workstation in its own hue.
   Tokens come from the dashboard stylesheet (--blu, --tel, --t0..t4, --s1.., --b1..); hues below are generated per workstation. */
:root{color-scheme:dark;--ok:#43D99B;--bad:#FF7188;}
.wrap{padding-block:24px 60px;padding-inline:max(16px,clamp(12px,2.5vw,40px));max-width:1500px;margin:0 auto;}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:22px;}
.head h1{font-size:clamp(26px,4vw,40px);line-height:1.05;letter-spacing:-.02em;color:var(--t0);text-wrap:balance;}
.head h1 span{color:var(--blu);}
.head p{color:var(--t2);max-width:60ch;margin-top:8px;font-size:13px;}
.kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--tel);text-transform:uppercase;margin-bottom:10px;display:flex;gap:8px;align-items:center;}
.kick i{width:6px;height:6px;border-radius:50%;background:var(--tel);box-shadow:0 0 10px var(--tel);}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px;}
.tools input[type=text]{flex:1 1 220px;min-width:0;}
.tools input[type=text]{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r8);color:var(--t0);padding:9px 12px;font:16px 'Inter',sans-serif;}
.tools input[type=text]:focus{outline:none;border-color:var(--blu);}
.tools input[type=text]::placeholder{color:var(--t3);}
.tgl{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--t1);background:var(--s1);border:1px solid var(--b1);border-radius:var(--r8);padding:8px 12px;cursor:pointer;user-select:none;}
.tgl input{accent-color:var(--blu);width:15px;height:15px;}
.tabs2{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.tab2{font:600 13px 'Inter',sans-serif;color:var(--t1);background:var(--s1);border:1px solid var(--b1);border-radius:var(--r8);padding:9px 16px;cursor:pointer;display:flex;gap:10px;align-items:center;}
.tab2 b{font-family:var(--mono);font-weight:500;font-size:11px;color:var(--t3);}
#tabs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
#tabs .tab2{flex-direction:column;align-items:stretch;gap:6px;text-align:left;padding:16px 16px 14px;border-radius:18px;position:relative;overflow:hidden;
 background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.16);
 -webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 24px rgba(0,0,0,.28);transition:transform .15s,border-color .15s,box-shadow .15s;}
#tabs .tab2::before{content:"";position:absolute;inset:0 0 55% 0;background:linear-gradient(180deg,rgba(255,255,255,.12),transparent);pointer-events:none;}
#tabs .tab2 .tn{font:800 26px/1 'JetBrains Mono',monospace;letter-spacing:.04em;color:var(--t0);position:relative;}
#tabs .tab2 .tc{font:600 13px var(--mono);color:var(--t1);position:relative;}
#tabs .tab2 .tc em{font-style:normal;color:var(--t3);font-weight:500;}
#tabs .tab2 .bar{height:6px;border-radius:99px;background:rgba(255,255,255,.10);overflow:hidden;position:relative;margin-top:2px;}
#tabs .tab2 .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blu),var(--tel));border-radius:99px;}
#tabs .tab2:active{transform:scale(.98);}
#tabs .tab2.on{border-color:var(--blu);background:linear-gradient(145deg,color-mix(in srgb,var(--blu) 30%,transparent),color-mix(in srgb,var(--blu) 8%,transparent));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 0 1px var(--blu),0 10px 30px color-mix(in srgb,var(--blu) 28%,transparent);}
#tabs .tab2.on .tn{color:#fff;}
.tab2.on{color:var(--t0);border-color:var(--blu);background:var(--blu-d);}
.tab2:focus-visible,.btn:focus-visible,.tin:focus-visible{outline:2px solid var(--blu);outline-offset:2px;}
.sec{margin-top:34px;padding-top:18px;border-top:1px solid var(--b1);}
.sec:first-child{border-top:0;padding-top:0;margin-top:20px;}
.cats{margin-top:-6px;}
.cats .tab2{font-size:12.5px;padding:8px 14px;}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.sec-h h2{font-size:20px;color:var(--t0);letter-spacing:.02em;}
.sec-h span{color:var(--t2);font-size:12px;}
.sec-h em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--t3);margin-left:auto;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px;}
.ws{--c:#59C7FF;background:var(--bg1);border:1px solid color-mix(in srgb,var(--c) 38%,transparent);border-radius:var(--r12);overflow:hidden;min-width:0;display:flex;flex-direction:column;}
.ws-top{background:color-mix(in srgb,var(--c) 20%,var(--bg1));padding:16px 14px;display:flex;gap:10px;align-items:center;border-bottom:1px solid color-mix(in srgb,var(--c) 38%,transparent);}
.sw{width:38px;height:38px;border-radius:50%;background:var(--c);flex:0 0 38px;display:grid;place-items:center;font:800 15px var(--mono);color:#07111F;}
.ws-name{display:inline-block;font:800 21px/1.15 'JetBrains Mono',monospace;color:#07111F;background:var(--c);padding:5px 11px;border-radius:8px;letter-spacing:.03em;overflow-wrap:anywhere;box-shadow:0 2px 14px color-mix(in srgb,var(--c) 40%,transparent);}
.ws-meta{font-size:13px;color:var(--t1);margin-top:7px;overflow-wrap:anywhere;}
.ws-meta b{font-family:var(--mono);font-weight:500;color:var(--t0);}
.ws-prog{margin-left:auto;font:600 13px var(--mono);color:var(--t1);white-space:nowrap;}
.dv-p{font:600 12px ui-monospace,Consolas,monospace;color:var(--tel);margin-top:2px;letter-spacing:.3px}
.dv{padding:11px 14px;border-top:1px solid var(--t4);display:grid;gap:8px;}
.dv:first-of-type{border-top:0;}
.dv-t{font-weight:600;color:var(--t0);font-size:13px;}
.dv-m{font-size:11.5px;color:var(--t2);margin-top:2px;}
.dv-i{display:flex;gap:10px;align-items:stretch;}
.tin{flex:1;min-width:0;background:var(--bg0);border:1px solid var(--b1);border-radius:var(--r8);color:var(--t0);font:600 16px var(--mono);padding:10px 12px;text-transform:uppercase;letter-spacing:.06em;}
.tin::placeholder{color:var(--t3);text-transform:none;letter-spacing:0;}
.tin.ok{border-color:var(--ok);background:rgba(67,217,155,.10);color:var(--ok);font-weight:700;}
.tin.bad{border-color:var(--bad);background:rgba(255,113,136,.10);}
.tin:focus{outline:none;border-color:var(--blu);}
.dv-e{font-size:12px;color:var(--bad);margin-top:-2px;}
.dv-e[hidden]{display:none;}
.st{font:700 11px var(--mono);letter-spacing:.1em;flex:0 0 auto;min-width:92px;text-align:center;border-radius:var(--r8);border:1px solid var(--b2);padding:11px 12px;color:var(--t0);background:var(--s2);cursor:pointer;white-space:nowrap;}
.st:hover{background:var(--s3);}
.st:focus-visible{outline:2px solid var(--blu);outline-offset:2px;}
.st.ok{color:#07111F;background:var(--ok);border-color:var(--ok);}
.hint{font-size:11px;color:var(--t3);margin-top:8px;}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--s3);color:var(--t0);border:1px solid var(--b2);padding:10px 16px;border-radius:var(--r8);font-size:12.5px;z-index:400;max-width:calc(100% - 32px);}
.empty{padding:36px 0;color:var(--t2);}
.pg-note{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--t2);font-size:12px;}
</style>

// one hue per workstation, spread by golden angle so neighbours never look alike
function hueOf(i){ return Math.round((i * 137.5 + 205) % 360); }
function hslCss(i){ return `hsl(${hueOf(i)} 78% 66%)`; }
function hslHex(i, l){ // l in 0..1 lightness for excel fills
  const h = hueOf(i) / 360, s = .7, a = s * Math.min(l, 1 - l);
  const f = n => { const k = (n + h * 12) % 12; const c = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1); return Math.round(c * 255).toString(16).padStart(2, '0'); };
  return (f(0) + f(8) + f(4)).toUpperCase();
}

function norm(v){
  if (v && typeof v === 'object' && TAG_RE.test(v.t || '')) return {t: v.t, at: v.at || ''};
  if (typeof v === 'string' && TAG_RE.test(v)) return {t: v, at: ''};

}
const dirty = new Set();
function persist(key){
  dirty.add(key);
  try { localStorage.setItem('elq_tags_v2', JSON.stringify(tags)); } catch (e) {}
  if (!(usingDb && dbCol)) { dirty.delete(key); return; }
  const ref = dbCol.doc(key), v = tags[key];
  (v ? ref.set({tag: v.t, at: v.at}) : ref.delete())
    .then(() => dirty.delete(key), () => { dirty.delete(key); usingDb = false; setNote(); });
}
function setNote(){
  document.getElementById('syncnote').textContent = (usingDb

function counts(t){
  const all = FLAT.filter(x => x.t === t);
  const ok = all.filter(x => tagState(x.d.key) === 'ok').length;
  return {total: all.length, ok, left: all.length - ok, ws: new Set(all.map(x => x.n.node)).size};
}

  document.getElementById('cats').innerHTML =
    `<button type="button" class="tab2${cat === 'all' ? ' on' : ''}" data-c="all">All categories<b>${allG.ok}/${allG.t}</b></button>` +
    DATA[cur].map(g => { const k = gst(g); return `<button type="button" class="tab2${cat === g.g ? ' on' : ''}" data-c="${esc(g.g)}" title="${esc(g.desc)}">${esc(g.g)}<b>${k.ok}/${k.t}</b></button>`; }).join('');
  document.getElementById('tabs').innerHTML = TERMS.map(t => { const k = counts(t); return `<button type="button" class="tab2${t === cur ? ' on' : ''}" data-t="${t}"><span class="tn">${t}</span><span class="tc">${k.ok}/${k.total} <em>tagged</em></span><span class="bar"><i style="width:${k.total ? Math.round(100*k.ok/k.total) : 0}%"></i></span></button>`; }).join('');
}

function render(){
  renderMetrics();
  const q = document.getElementById('q').value.trim().toLowerCase();
  const pend = document.getElementById('pend').checked;
  let html = '', shown = 0;
  DATA[cur].forEach(g => {
    if (cat !== 'all' && g.g !== cat) return;
    const cards = g.nodes.map(n => {
      const devs = n.devs.filter(d => {
        if (pend && tagState(d.key) === 'ok') return false;
        if (!q) return true;
        return [n.node, n.loc, d.type, d.model].some(v => (v || '').toLowerCase().includes(q));
      });
      if (!devs.length) return '';
      const done = n.devs.filter(d => tagState(d.key) === 'ok').length;
      const col = hslCss(n.ci);
      shown += devs.length;
      return `<article class="ws" style="--c:${col}">
        <div class="ws-top"><div class="sw">${n.ci + 1}</div><div style="min-width:0"><div class="ws-name">${esc(n.node)}</div>
        <div class="ws-meta">${esc(n.loc)}</div></div><div class="ws-prog">${done}/${n.devs.length}</div></div>
        ${devs.map(d => {
          const st = tagState(d.key), val = st === 'ok' ? tagText(d.key) : (drafts[d.key] || '');
          return `<div class="dv"><div style="min-width:0"><div class="dv-t">${esc(d.type)}</div>${d.plan ? `<div class="dv-p">Planned ${esc(d.plan)}</div>` : ''}${d.model ? `<div class="dv-m">${esc(d.model)}</div>` : ''}</div>
            <div class="dv-i"><input class="tin ${st === 'ok' ? 'ok' : ''}" type="text" inputmode="text" enterkeyhint="done" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="10" placeholder="XS + 8 digits" value="${esc(val)}" data-k="${esc(d.key)}" ${st === 'ok' ? 'readonly' : ''} aria-label="SITA tag for ${esc(n.node)} ${esc(d.type)}"/>
            <button type="button" class="st ${st === 'ok' ? 'ok' : ''}" data-act="chip" aria-pressed="${st === 'ok'}" aria-label="${st === 'ok' ? 'Tag saved. Press to edit' : 'Save SITA tag'}: ${esc(n.node)} ${esc(d.type)}">${label(st)}</button></div><div class="dv-e" hidden></div></div>`;
        }).join('')}</article>`;
    }).filter(Boolean).join('');
    if (cards) html += `<section class="sec"><div class="sec-h"><h2>${esc(g.g)}</h2><span>${esc(g.desc)}</span><em>${g.nodes.length} workstation${g.nodes.length > 1 ? 's' : ''} · ${g.nodes.flatMap(n => n.devs).filter(d => tagState(d.key) === 'ok').length}/${g.nodes.flatMap(n => n.devs).length} tagged</em></div><div class="grid">${cards}</div></section>`;
  });
  document.getElementById('out').innerHTML = html || '<div class="empty">Nothing matches. Clear the search or untick "Pending only".</div>';
}

function rowOf(i){ const k = i.dataset.k; return FLAT.find(x => x.d.key === k); }
// XS then exactly 8 digits: nothing else can be typed, extra characters are dropped
function clean(raw){
  let v = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (/^\d/.test(v)) v = 'XS' + v;           // digits first: add the XS for the user
  let o = '';
  for (const c of v) {
    if (o.length === 0) { if (c === 'X') o += c; }
    else if (o.length === 1) { if (c === 'S') o += c; }
    else if (c >= '0' && c <= '9') o += c;
    if (o.length === 10) break;
  }
  return o;
}
function showErr(i, msg){
  const e = i.closest('.dv').querySelector('.dv-e');
  i.classList.toggle('bad', !!msg); e.hidden = !msg; e.textContent = msg || '';
}
function refreshRow(i){
  const k = i.dataset.k, st = tagState(k), b = i.parentElement.querySelector('.st');
  i.className = 'tin ' + (st === 'ok' ? 'ok' : ''); i.readOnly = st === 'ok'; i.value = st === 'ok' ? tagText(k) : (drafts[k] || '');
  showErr(i, '');
  b.className = 'st ' + (st === 'ok' ? 'ok' : ''); b.textContent = label(st); b.setAttribute('aria-pressed', st === 'ok');
  const card = i.closest('.ws'), name = card.querySelector('.ws-name').textContent;
  const n = DATA[cur].flatMap(g => g.nodes).find(x => x.node === name);
  if (n) card.querySelector('.ws-prog').textContent = n.devs.filter(d => tagState(d.key) === 'ok').length + '/' + n.devs.length;
  renderMetrics();
}
function press(b){
  const i = b.parentElement.querySelector('.tin'), k = i.dataset.k, x = rowOf(i);
  if (tags[k]) {                       // already saved: press again to edit
    drafts[k] = tags[k].t; delete tags[k]; persist(k); refreshRow(i); toast('Back to TO DO. Change the number and press TO DO'); return;
  }
  const v = clean(i.value); i.value = v; drafts[k] = v;
  const bad = m => showErr(i, m);
  if (!v) return bad('Type the SITA tag: XS and 8 digits');
  if (v.length < 10) return bad('Too short: ' + Math.max(0, v.length - 2) + ' of 8 digits. Add ' + (10 - v.length) + ' more');
  const other = Object.keys(tags).find(o => tags[o].t === v && o !== k);
  if (other) { const y = FLAT.find(z => z.d.key === other); return bad(v + ' is already saved for ' + (y ? y.n.node + ' ' + y.d.type : 'another device')); }
  if (REG[v]) return bad(v + ' already belongs to ' + REG[v]);
  tags[k] = {t: v, at: new Date().toISOString()}; delete drafts[k]; persist(k); refreshRow(i);
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();   // close the keyboard
  toast('Saved ' + v + ' for ' + x.n.node + ' · ' + x.d.type);
}
const outEl = document.getElementById('out');
outEl.addEventListener('input', e => {
  const i = e.target.closest('.tin'); if (!i) return;

});
outEl.addEventListener('keydown', e => { const i = e.target.closest('.tin'); if (i && e.key === 'Enter'){ e.preventDefault(); press(i.parentElement.querySelector('.st')); i.blur(); } });

const placedAt = k => { const v = tags[k]; if (!v || !v.at || isNaN(Date.parse(v.at))) return ''; return new Date(v.at).toLocaleString('en-GB'); };
function rowsFor(terms){
  return FLAT.filter(x => terms.includes(x.t)).map(x => [x.t, x.g.g, x.n.node, x.n.loc, x.d.type, x.d.model || '', x.d.plan || '', tagText(x.d.key), tagState(x.d.key) === 'ok' ? 'Yes' : 'No', placedAt(x.d.key)]);
}
const HEAD = ['Terminal', 'Page', 'Workstation', 'Location', 'Device Type', 'Model', 'Planned Tag', 'New SITA Tag', 'Tag placed', 'Placed at'];
async function save(name, data){
  const dl = (typeof claude !== 'undefined') ? await claude.use('downloads').catch(() => null) : null;
  try {
    if (dl) { await dl.save({filename: name, data}); }
    else {
      const blob = new Blob([data], {type: name.endsWith('.csv') ? 'text/csv;charset=utf-8' : 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }
    toast('Saved ' + name);
  } catch (e) { if (e && e.code !== 'declined') toast('Could not save the file'); }
}
const stamp = () => new Date().toISOString().slice(0, 10);
function csv(terms, label){
  const q = c => '"' + String(c).replace(/"/g, '""') + '"';
  save(`ELQ_SITA_Tag_${label}_${stamp()}.csv`, '﻿' + [HEAD, ...rowsFor(terms)].map(r => r.map(q).join(',')).join('\r\n'));
}
async function xlsx(terms, label){
  if (!window.ExcelJS){ toast('Excel library did not load. Use CSV or try again.'); return; }
  const wb = new ExcelJS.Workbook(); wb.creator = 'ELQ Airport IT';
  const border = {top:{style:'thin',color:{argb:'FF2A4A66'}},bottom:{style:'thin',color:{argb:'FF2A4A66'}},left:{style:'thin',color:{argb:'FF2A4A66'}},right:{style:'thin',color:{argb:'FF2A4A66'}}};
  terms.forEach(t => {
    const ws = wb.addWorksheet(t, {views:[{state:'frozen', ySplit:3}]});
    ws.mergeCells(1, 1, 1, HEAD.length);
    Object.assign(ws.getCell(1, 1), {value: `${t} · Devices without SITA tag`, font:{bold:true, size:14, color:{argb:'FFFFFFFF'}}, fill:{type:'pattern', pattern:'solid', fgColor:{argb:'FF0B1B2D'}}, alignment:{vertical:'middle', indent:1}});
    ws.getRow(1).height = 30;
    ws.mergeCells(2, 1, 2, HEAD.length);
    Object.assign(ws.getCell(2, 1), {value: `Each workstation has its own colour · exported ${new Date().toLocaleString()}`, font:{italic:true, size:9, color:{argb:'FF6B7C8F'}}, alignment:{indent:1}});
    const hr = ws.getRow(3); hr.height = 22;
    HEAD.forEach((h, i) => Object.assign(hr.getCell(i + 1), {value:h, font:{bold:true, color:{argb:'FFFFFFFF'}}, fill:{type:'pattern', pattern:'solid', fgColor:{argb:'FF183A5A'}}, border}));
    const rows = FLAT.filter(x => x.t === t);
    rows.forEach(x => {
      const r = ws.addRow([x.t, x.g.g, x.n.node, x.n.loc, x.d.type, x.d.model || '', x.d.plan || '', tagText(x.d.key), tagState(x.d.key) === 'ok' ? 'Yes' : 'No', placedAt(x.d.key)]);
      r.eachCell({includeEmpty:true}, (c, i) => { c.border = border; c.alignment = {vertical:'middle'}; if (i <= 3) c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF' + hslHex(x.n.ci, .82)}}; });
      r.getCell(3).font = {bold:true, name:'Consolas', color:{argb:'FF07111F'}};
      r.getCell(7).font = {name:'Consolas', size:10, color:{argb:'FF0F766E'}}; r.getCell(8).font = {name:'Consolas', size:11, bold:true};
      if (r.getCell(9).value === 'Yes') { [8, 9].forEach(c => { r.getCell(c).fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFC6EFCE'}}; }); r.getCell(9).font = {bold:true, color:{argb:'FF006100'}}; }
    });
    [10, 11, 18, 28, 28, 24, 16, 18, 12, 20].forEach((w, i) => ws.getColumn(i + 1).width = w);
    ws.autoFilter = {from:{row:3, column:1}, to:{row:3, column:HEAD.length}};
  });
  const buf = await wb.xlsx.writeBuffer();
  save(`ELQ_SITA_Tag_${label}_${stamp()}.xlsx`, buf);
}
document.getElementById('xl-cur').onclick = () => xlsx([cur], cur);
document.getElementById('csv-cur').onclick = () => csv([cur], cur);
document.getElementById('xl-all').onclick = () => xlsx(TERMS, 'Both');

// ---- clock ----
setInterval(() => { document.getElementById('clk').textContent = new Date().toLocaleTimeString('en-GB'); }, 1000);

// ---- boot: render with whatever is in this browser, then light up shared storage ----
try { const raw = JSON.parse(localStorage.getItem('elq_tags_v2') || localStorage.getItem('elq_tags_v1') || '{}') || {}; tags = {}; Object.keys(raw).forEach(k => { const v = norm(raw[k]); if (v) tags[k] = v; }); } catch (e) { tags = {}; }
setNote(); render();
(async () => {
  try {
    if (typeof claude === 'undefined') return; const db = await claude.use('db'); if (!db) return;
    dbCol = db.collection('tags'); let firstSnap = true;
    dbCol.onSnapshot(snap => {
      const m = {}; snap.docs.forEach(d => { const v = norm({t: (d.data() || {}).tag, at: (d.data() || {}).at}); if (v) m[d.id] = v; });
      const valid = new Set(FLAT.map(x => x.d.key));
      if (firstSnap) { firstSnap = false; Object.keys(tags).forEach(k => { if (valid.has(k) && !(k in m)) { m[k] = tags[k]; dbCol.doc(k).set({tag: tags[k].t, at: tags[k].at}).catch(() => {}); } }); }
      dirty.forEach(k => { if (tags[k]) m[k] = tags[k]; else delete m[k]; });
      usingDb = true; tags = m; setNote();
      const a = document.activeElement; if (a && a.classList && a.classList.contains('tin')) { renderMetrics(); return; }
      render();
    }, () => { usingDb = false; setNote(); });
  } catch (e) { usingDb = false; }
})();
</script>
